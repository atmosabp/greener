services:
  database:
    build: ./database
    container_name: greener-database
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  backend:
    build: ./backend
    container_name: greener-backend
    command: npm run dev
    ports:
      - "${PORT}:${PORT}"
    environment:
      PORT: ${PORT:?Defina PORT no .env}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      NODE_WATCH_USE_POLLING: "true"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + process.env.PORT + '/health').then(res => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - ./backend:/app
      - /app/node_modules
    
  frontend:
    build: ./frontend
    container_name: greener-frontend
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "${FRONT_PORT}:5173"
    environment:
      BACKEND_PORT: ${PORT}
    depends_on:
      backend:
        condition: service_healthy
    stdin_open: true
    volumes:
      - ./frontend:/app
      - /app/node_modules/

volumes:
  postgres_data:
