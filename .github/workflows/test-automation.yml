name: Automacao Testes Backend

on:
  push:
  pull_request:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    
    steps:
      - name: Ver repositorio
        uses: actions/checkout@v4

      - name: Configurar .env
        run: |
          # Gera um .env para o GitHub Actions
          echo "PORT=${{ secrets.PORT }}" >> .env
          echo "PGPORT=${{ secrets.PGPORT }}" >> .env
          echo "FRONT_PORT=${{ secrets.FRONT_PORT }}" >> .env
          echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" >> .env
          echo "POSTGRES_HOST=${{ secrets.POSTGRES_HOST }}" >> .env
          echo "POSTGRES_PORT=${{ secrets.POSTGRES_PORT }}" >> .env
          echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> .env
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env

      - name: Iniciar composer
        run: docker compose up -d --build

      - name: Aguardar banco de dados iniciar
        run: sleep 5

      - name: Iniciar Jest
        run: |
          docker compose exec -T backend npm install
          docker compose exec -T backend npm test
    
      - name: Fazer limpeza containers
        if: always()
        run: |
          docker compose logs database
          docker compose down -v
